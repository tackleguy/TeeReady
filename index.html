<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f4ed" />
    <link
      rel="preload"
      href="/fonts/sora-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sora-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/literata-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Playability forecasts, wind-adjusted yardages, and round prep for your tee time."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>TeeReady — golf weather intelligence</title>
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('teeready-theme-v1') ||
            localStorage.getItem('ws-theme-v1') ||
            'light';
          if (raw === 'midnight') raw = 'dark';
          var theme = raw;
          if (raw === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (theme !== 'light' && theme !== 'dark' && theme !== 'sand') {
            theme = 'light';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
